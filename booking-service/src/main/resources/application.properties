server.port=8084
spring.application.name=booking-service

spring.datasource.url=jdbc:mysql://localhost:3306/aeronix_db
spring.datasource.username=root
spring.datasource.password=${DATABASE_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Internal service URLs (resolved via Eureka LB)
flight.service.url=http://flight-service
seat.service.url=http://seat-service
notification.service.url=http://notification-service
passenger.service.url=http://passenger-service

# Tax rates
booking.tax.gst=0.05
booking.tax.fuel.surcharge=0.02

# Check-in window
checkin.open.hours.before=24
checkin.close.hours.before=1

# SpringDoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.info.title=Aeronix Booking Service
springdoc.info.version=1.0.0
springdoc.info.description=Aeronix Airline Booking System - Booking Service
