server.port=8081
spring.application.name=auth-service

spring.datasource.url=jdbc:mysql://localhost:3306/aeronix_db
spring.datasource.username=root
spring.datasource.password=${DATABASE_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

jwt.expiration=86400000

# SpringDoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.info.title=Aeronix Auth Service
springdoc.info.version=1.0.0
springdoc.info.description=Aeronix Airline Booking System - Auth Service

# JWT Secret (must match api-gateway jwt.secret)
jwt.secret=${JWT_SECRET}
