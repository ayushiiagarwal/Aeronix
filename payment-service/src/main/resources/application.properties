server.port=8086
spring.application.name=payment-service

spring.datasource.url=jdbc:mysql://localhost:3306/aeronix_db
spring.datasource.username=root
spring.datasource.password=${DATABASE_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

booking.service.url=http://booking-service
notification.service.url=http://notification-service

# Razorpay config (replace with real keys)
razorpay.key.id=${RAZORPAY_KEY}
razorpay.key.secret=${RAZORPAY_SECRET}
razorpay.currency=INR

# Refund policy (percentage charged as cancellation fee by hours before departure)
refund.policy.0to4hours=100
refund.policy.4to24hours=50
refund.policy.24to72hours=25
refund.policy.72plusHours=0

# SpringDoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.info.title=Aeronix Payment Service
springdoc.info.version=1.0.0
springdoc.info.description=Aeronix Airline Booking System - Payment Service
