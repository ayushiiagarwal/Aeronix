server.port=8083
spring.application.name=seat-service

spring.datasource.url=jdbc:mysql://localhost:3306/aeronix_db
spring.datasource.username=root
spring.datasource.password=Ayushi@200405
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


# Seat hold expiry in minutes
seat.hold.expiry.minutes=15
# Scheduler runs every 2 minutes
seat.hold.scheduler.cron=0 */2 * * * *

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Flight service URL for seat counter sync
flight.service.url=http://flight-service



spring.cache.type=simple

# ── Redis ────────────────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
# SpringDoc OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.server-url=http://localhost:8080