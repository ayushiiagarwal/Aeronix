server.port=8080
spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Routes
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=flight-service
spring.cloud.gateway.routes[1].uri=lb://flight-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/flights/**

spring.cloud.gateway.routes[2].id=seat-service
spring.cloud.gateway.routes[2].uri=lb://seat-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/seats/**

spring.cloud.gateway.routes[3].id=booking-service
spring.cloud.gateway.routes[3].uri=lb://booking-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/bookings/**

spring.cloud.gateway.routes[4].id=passenger-service
spring.cloud.gateway.routes[4].uri=lb://passenger-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/passengers/**

spring.cloud.gateway.routes[5].id=payment-service
spring.cloud.gateway.routes[5].uri=lb://payment-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/payments/**

spring.cloud.gateway.routes[6].id=notification-service
spring.cloud.gateway.routes[6].uri=lb://notification-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/notifications/**

spring.cloud.gateway.routes[7].id=airline-service
spring.cloud.gateway.routes[7].uri=lb://airline-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/airlines/**,/api/airports/**

# JWT
jwt.secret=${JWT_SECRET}

# Swagger API-docs routes (strip /{service}/v3/api-docs -> /v3/api-docs on target)
spring.cloud.gateway.routes[8].id=auth-service-docs
spring.cloud.gateway.routes[8].uri=lb://auth-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/auth-service/v3/api-docs
spring.cloud.gateway.routes[8].filters[0]=RewritePath=/auth-service/(?<segment>.*), /${segment}

spring.cloud.gateway.routes[9].id=flight-service-docs
spring.cloud.gateway.routes[9].uri=lb://flight-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/flight-service/v3/api-docs
spring.cloud.gateway.routes[9].filters[0]=RewritePath=/flight-service/(?<segment>.*), /${segment}

spring.cloud.gateway.routes[10].id=seat-service-docs
spring.cloud.gateway.routes[10].uri=lb://seat-service
spring.cloud.gateway.routes[10].predicates[0]=Path=/seat-service/v3/api-docs
spring.cloud.gateway.routes[10].filters[0]=RewritePath=/seat-service/(?<segment>.*), /${segment}

spring.cloud.gateway.routes[11].id=booking-service-docs
spring.cloud.gateway.routes[11].uri=lb://booking-service
spring.cloud.gateway.routes[11].predicates[0]=Path=/booking-service/v3/api-docs
spring.cloud.gateway.routes[11].filters[0]=RewritePath=/booking-service/(?<segment>.*), /${segment}

spring.cloud.gateway.routes[12].id=passenger-service-docs
spring.cloud.gateway.routes[12].uri=lb://passenger-service
spring.cloud.gateway.routes[12].predicates[0]=Path=/passenger-service/v3/api-docs
spring.cloud.gateway.routes[12].filters[0]=RewritePath=/passenger-service/(?<segment>.*), /${segment}

spring.cloud.gateway.routes[13].id=payment-service-docs
spring.cloud.gateway.routes[13].uri=lb://payment-service
spring.cloud.gateway.routes[13].predicates[0]=Path=/payment-service/v3/api-docs
spring.cloud.gateway.routes[13].filters[0]=RewritePath=/payment-service/(?<segment>.*), /${segment}

spring.cloud.gateway.routes[14].id=notification-service-docs
spring.cloud.gateway.routes[14].uri=lb://notification-service
spring.cloud.gateway.routes[14].predicates[0]=Path=/notification-service/v3/api-docs
spring.cloud.gateway.routes[14].filters[0]=RewritePath=/notification-service/(?<segment>.*), /${segment}

spring.cloud.gateway.routes[15].id=airline-service-docs
spring.cloud.gateway.routes[15].uri=lb://airline-service
spring.cloud.gateway.routes[15].predicates[0]=Path=/airline-service/v3/api-docs
spring.cloud.gateway.routes[15].filters[0]=RewritePath=/airline-service/(?<segment>.*), /${segment}

# SpringDoc Gateway config
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.disable-swagger-default-url=true

#Cors
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=false