server.port=8087
spring.application.name=notification-service

spring.datasource.url=jdbc:mysql://localhost:3306/aeronix_db
spring.datasource.username=root
spring.datasource.password=${DATABASE_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# JavaMailSender (Email Notification)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=aeronix.support@gmail.com
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=aeronix.support@gmail.com

# SMS — Twilio
twilio.account.sid=${SID}
twilio.auth.token=${TOKEN}
twilio.from.number=${NUMBER}
twilio.enabled=true

# Async thread pool
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100

# SpringDoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.info.title=Aeronix Notification Service
springdoc.info.version=1.0.0
springdoc.info.description=Aeronix Airline Booking System - Notification Service
